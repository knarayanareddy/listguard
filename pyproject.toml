[build-system]
requires = [
    "setuptools==78.1.1",
    "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "listguard"
version = "0.1.0"
description = "Deterministic marketplace listing trust and safety control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pydantic==2.11.5",
    "jinja2==3.1.6",
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[project.scripts]
listguard = "listguard.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["listguard*"]
exclude = ["fixtures*", "tests*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true